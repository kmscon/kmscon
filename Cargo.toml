# kmscon-rs: the Rust parts of kmscon, built as a single static library
# linked into the kmscon binary. It contains libtsm (src/tsm) and the
# modules converted from C.
[package]
name = "kmscon-rs"
version = "10.1.2"
edition = "2024"
description = "Rust parts of kmscon, with their C bindings"
license = "MIT"
publish = false

[lib]
name = "kmscon_rs"
path = "src/lib.rs"
# staticlib is linked into kmscon, rlib is used by the tests
crate-type = ["staticlib", "rlib"]

[dependencies]
vte = "0.15"
unicode-width = "0.2"

[[test]]
name = "golden"
path = "tests/tsm/golden/main.rs"

[[test]]
name = "stress"
path = "tests/tsm/stress.rs"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
